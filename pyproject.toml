[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "yuri-sc2"
version = "0.2.0"
description = "Pluggable macro-decision policies for StarCraft II"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
laya = ["laya==0.3.21"]
game = ["burnysc2>=7,<8"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
yuri = "yuri_next.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yuri_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
